# app that connects to postgres with the password from app-db-secret
apiVersion: batch/v1
kind: Job
metadata:
  name: db-client
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: client
          image: postgres:16-alpine
          command: ["sh", "-c", "psql -h yatri-postgres -U yatri_admin -d postgres -c 'select version();'"]
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-db-secret
                  key: DB_PASSWORD
