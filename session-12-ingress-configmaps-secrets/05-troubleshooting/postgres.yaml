# postgres started with the CORRECT password from a secret created with: kubectl create secret generic pg-server-secret --from-literal=POSTGRES_PASSWORD=mypassword
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yatri-postgres
  template:
    metadata:
      labels:
        app: yatri-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: yatri_admin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-server-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: yatri-postgres
spec:
  selector:
    app: yatri-postgres
  ports:
    - port: 5432
