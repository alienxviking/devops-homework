# uses the ConfigMap 3 ways: single key, all keys (envFrom) and as files (volume)
apiVersion: v1
kind: Pod
metadata:
  name: configmap-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: APP_ENV                 # single key, renamed
          valueFrom:
            configMapKeyRef:
              name: yatri-app-config
              key: ENVIRONMENT
      envFrom:
        - configMapRef:                 # every key becomes an env variable
            name: yatri-app-config
      volumeMounts:
        - name: config-volume           # every key becomes a file
          mountPath: /etc/app-config
          readOnly: true
  volumes:
    - name: config-volume
      configMap:
        name: yatri-app-config
