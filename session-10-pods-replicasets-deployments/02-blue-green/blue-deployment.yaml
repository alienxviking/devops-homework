apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp
      version: blue
  template:
    metadata:
      labels:
        app: myapp
        version: blue
    spec:
      containers:
        - name: myapp
          image: hashicorp/http-echo:1.0
          args: ["-text=Hello from the BLUE version (v1)"]
          ports:
            - containerPort: 5678
