apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-rolling
  annotations:
    kubernetes.io/change-cause: "initial release nginx 1.26"
spec:
  replicas: 4
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # at most 1 extra pod above 4 during the update
      maxUnavailable: 1    # at most 1 pod can be down during the update
  selector:
    matchLabels:
      app: web-rolling
  template:
    metadata:
      labels:
        app: web-rolling
    spec:
      containers:
        - name: nginx
          image: nginx:1.26-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: web-rolling
spec:
  selector:
    app: web-rolling
  ports:
    - port: 80
      targetPort: 80
