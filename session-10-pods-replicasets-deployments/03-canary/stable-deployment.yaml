apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-stable
spec:
  replicas: 9
  selector:
    matchLabels:
      app: shop
      track: stable
  template:
    metadata:
      labels:
        app: shop
        track: stable
    spec:
      containers:
        - name: shop
          image: hashicorp/http-echo:1.0
          args: ["-text=stable v1"]
          ports:
            - containerPort: 5678
