name: Session 16 - Notes API CI/CD

on:
  push:
    branches: [main]
    paths:
      - "session-16-cicd-github-actions/**"
      - ".github/workflows/session16-cicd.yml"
  pull_request:
    branches: [main]
    paths:
      - "session-16-cicd-github-actions/**"
  workflow_dispatch:

env:
  APP_DIR: session-16-cicd-github-actions
  IMAGE: ghcr.io/${{ github.repository_owner }}/notes-api

jobs:
  # ---------------- CI ----------------
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: session-16-cicd-github-actions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: session-16-cicd-github-actions/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: flake8 app tests

  test:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: session-16-cicd-github-actions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            session-16-cicd-github-actions/requirements.txt
            session-16-cicd-github-actions/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest with coverage
        run: pytest -v --cov=app --cov-report=term --cov-report=xml --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            session-16-cicd-github-actions/test-results.xml
            session-16-cicd-github-actions/coverage.xml

  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build --build-arg APP_VERSION=${GITHUB_SHA::7} -t notes-api:${GITHUB_SHA::7} $APP_DIR
      - name: Smoke test the container
        run: |
          docker run -d --name notes -p 5000:5000 notes-api:${GITHUB_SHA::7}
          sleep 5
          curl -sf http://localhost:5000/health
          curl -sf http://localhost:5000/
      - name: Save image
        run: docker save notes-api:${GITHUB_SHA::7} | gzip > notes-api.tar.gz
      - name: Upload image artifact
        uses: actions/upload-artifact@v5
        with:
          name: docker-image
          path: notes-api.tar.gz
          retention-days: 3

  # ---------------- CD ----------------
  push:
    name: Push to GHCR
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: docker-image
      - run: gunzip -c notes-api.tar.gz | docker load
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push
        run: |
          SHORT=${GITHUB_SHA::7}
          docker tag notes-api:$SHORT $IMAGE:$SHORT
          docker tag notes-api:$SHORT $IMAGE:latest
          docker push $IMAGE:$SHORT
          docker push $IMAGE:latest

  deploy:
    name: Deploy to Kubernetes (kind)
    needs: push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: docker-image
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: staging
      - name: Load image into the cluster
        run: |
          gunzip -c notes-api.tar.gz | docker load
          kind load docker-image notes-api:${GITHUB_SHA::7} --name staging
      - name: Create secret from GitHub secret
        run: |
          kubectl create secret generic notes-api-secret \
            --from-literal=API_TOKEN="${{ secrets.NOTES_API_TOKEN }}"
      - name: Deploy
        run: |
          sed "s|IMAGE_PLACEHOLDER|notes-api:${GITHUB_SHA::7}|" $APP_DIR/k8s/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/notes-api --timeout=120s
          kubectl get pods -o wide
      - name: Smoke test
        run: |
          kubectl port-forward svc/notes-api 8080:80 &
          sleep 3
          curl -s http://localhost:8080/
          curl -s -X POST -H "Content-Type: application/json" -d '{"text":"deployed by github actions"}' http://localhost:8080/notes
          curl -s http://localhost:8080/notes
