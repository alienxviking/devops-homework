name: Session 17 - DevSecOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - "session-17-devsecops/**"
      - ".github/workflows/session17-devsecops.yml"
  pull_request:
    branches: [main]
    paths:
      - "session-17-devsecops/**"
  workflow_dispatch:

env:
  APP_DIR: session-17-devsecops
  IMAGE: ghcr.io/${{ github.repository_owner }}/secure-tasks

jobs:
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: session-17-devsecops
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies (build)
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile check
        run: python -m compileall -q app
      - name: Unit tests
        run: pytest -v --junitxml=reports/unit-tests.xml
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: unit-test-report
          path: session-17-devsecops/reports/

  sast:
    name: SAST (Bandit + Semgrep)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install bandit==1.9.4 semgrep==1.180.0
      - name: Bandit
        run: |
          mkdir -p reports
          bandit -r $APP_DIR/app -c $APP_DIR/security/bandit.yaml -f json -o reports/bandit.json || true
          bandit -r $APP_DIR/app -c $APP_DIR/security/bandit.yaml --severity-level medium
      - name: Semgrep
        run: semgrep scan --config p/python --config p/owasp-top-ten --error --metrics=off --json --output reports/semgrep.json $APP_DIR/app
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: sast-reports
          path: reports/

  sca:
    name: SCA (pip-audit + Trivy fs)
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.7.3
      - name: pip-audit (known CVEs in dependencies)
        run: |
          mkdir -p reports
          pip-audit -r $APP_DIR/requirements.txt -f json -o reports/pip-audit.json || true
          pip-audit -r $APP_DIR/requirements.txt --desc
      - name: Trivy filesystem scan (dependencies)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.67.2 fs --scanners vuln             --severity HIGH,CRITICAL --exit-code 1 --no-progress /src/$APP_DIR
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: sca-reports
          path: reports/

  secret-scan:
    name: Secret Scan (Gitleaks)
    needs: sca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            dir /repo/$APP_DIR --config /repo/$APP_DIR/security/.gitleaks.toml \
            --report-format json --report-path /repo/gitleaks-report.json -v
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: secret-scan-report
          path: gitleaks-report.json

  docker-build:
    name: Docker Build
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t secure-tasks:${GITHUB_SHA::7} $APP_DIR
      - run: docker save secure-tasks:${GITHUB_SHA::7} -o image.tar
      - uses: actions/upload-artifact@v5
        with:
          name: image
          path: image.tar
          retention-days: 2

  image-scan:
    name: Container Image Scan (Trivy)
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: image
      - run: docker load -i image.tar
      - name: Trivy report (all severities, saved as artifact)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" aquasec/trivy:0.67.2 image             --format json --output /out/trivy-image.json --no-progress secure-tasks:${GITHUB_SHA::7}
      - name: Trivy image scan (fail on HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            secure-tasks:${GITHUB_SHA::7}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: image-scan-report
          path: trivy-image.json

  security-gate:
    name: Security Gate
    needs: [build-test, sast, sca, secret-scan, image-scan]
    runs-on: ubuntu-latest
    steps:
      - name: All security checks passed
        run: |
          echo "Unit tests     : ${{ needs.build-test.result }}"
          echo "SAST           : ${{ needs.sast.result }}"
          echo "SCA            : ${{ needs.sca.result }}"
          echo "Secret scan    : ${{ needs.secret-scan.result }}"
          echo "Image scan     : ${{ needs.image-scan.result }}"
          echo "Gate PASSED - image can be pushed"

  push:
    name: Push Image (GHCR)
    needs: security-gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: image
      - run: docker load -i image.tar
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker tag secure-tasks:${GITHUB_SHA::7} $IMAGE:${GITHUB_SHA::7}
          docker push $IMAGE:${GITHUB_SHA::7}

  deploy:
    name: Deploy to Kubernetes
    needs: push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          name: image
      - uses: helm/kind-action@v1
        with:
          cluster_name: devsecops
      - name: Load image and deploy
        run: |
          docker load -i image.tar
          kind load docker-image secure-tasks:${GITHUB_SHA::7} --name devsecops
          sed "s|IMAGE_PLACEHOLDER|secure-tasks:${GITHUB_SHA::7}|" $APP_DIR/k8s/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/secure-tasks --timeout=120s
          kubectl get pods -o wide
      - name: Smoke test
        run: |
          kubectl port-forward svc/secure-tasks 8080:80 &
          sleep 3
          curl -s http://localhost:8080/health
          curl -s -X POST -H "Content-Type: application/json" -d '{"title":"deployed after passing the security gate"}' http://localhost:8080/tasks
          curl -s http://localhost:8080/tasks
