# weekly dependency updates, one grouped PR per ecosystem
version: 2

updates:
  - package-ecosystem: pip
    directories:
      - /session-16-cicd-github-actions
      - /session-17-devsecops
      - /final-devops-project/application/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /final-devops-project/application/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /session-18-terraform-iac/terraform-s3-demo
      - /session-19-terraform-cloud/terraform-aws-infra
      - /final-devops-project/terraform
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      terraform:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
