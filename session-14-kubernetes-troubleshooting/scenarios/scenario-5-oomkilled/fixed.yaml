apiVersion: v1
kind: Pod
metadata:
  name: fail-5-oomkilled-pod
  labels:
    tier: triage-gauntlet
    scenario: oomkilled
spec:
  restartPolicy: OnFailure
  containers:
    - name: memory-leaker
      image: python:3.11-alpine
      command:
        - "python3"
        - "-c"
        - |
          print("Allocating memory rapidly...")
          chunks = []
          for i in range(10):
              chunks.append(b"x" * (10 * 1024 * 1024))
          print("Allocated", len(chunks) * 10, "MB - done")
      resources:
        requests:
          memory: "128Mi"
        limits:
          memory: "256Mi"     # FIX: limit sized for the real usage (~100MB)
