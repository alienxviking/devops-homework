apiVersion: v1
kind: Pod
metadata:
  name: fail-4-dns-failure-pod
  labels:
    tier: triage-gauntlet
    scenario: dns-failure
spec:
  containers:
    - name: client
      image: curlimages/curl:8.6.0
      command: ["sh", "-c"]
      args:
        - |
          echo "Attempting connection to internal web service...";
          # FIX: correct service name and namespace
          curl -s -o /dev/null -w "web-service.default.svc.cluster.local -> HTTP %{http_code}\n" --connect-timeout 3 http://web-service.default.svc.cluster.local || true
          echo "Process sleeping...";
          sleep 3600
