apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alienxviking/devops-homework.git
    targetRevision: main
    path: session-20-monitoring-gitops/gitops/app
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      prune: true      # delete resources that were removed from git
      selfHeal: true   # undo manual changes made in the cluster
    syncOptions:
      - CreateNamespace=true
