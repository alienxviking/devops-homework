apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-tasks
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-tasks
  template:
    metadata:
      labels:
        app: secure-tasks
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: secure-tasks
spec:
  selector:
    app: secure-tasks
  ports:
    - port: 80
      targetPort: 8000
