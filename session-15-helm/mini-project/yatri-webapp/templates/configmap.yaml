apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yatri.fullname" . }}-config
  labels:
    {{- include "yatri.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.environment | quote }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>{{ .Values.frontend.title }} ({{ .Values.environment }})</title></head>
    <body style="font-family: Arial, sans-serif; text-align: center; margin-top: 100px;">
      <h1 style="color: {{ .Values.frontend.color }};">{{ .Values.frontend.title }}</h1>
      <p>Environment: <b>{{ .Values.environment }}</b> | Release: <b>{{ .Release.Name }}</b> | Revision: <b>{{ .Release.Revision }}</b></p>
      <p>Chart {{ .Chart.Name }}-{{ .Chart.Version }} | frontend image {{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}</p>
    </body>
    </html>
