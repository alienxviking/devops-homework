apiVersion: v1
kind: Pod
metadata:
  name: {{ include "yatri.fullname" . }}-test
  labels:
    {{- include "yatri.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: check
      image: busybox:1.36
      command:
        - sh
        - -c
        - wget -qO- http://{{ include "yatri.fullname" . }}-frontend | grep -q '{{ .Values.environment }}' && wget -qO- http://{{ include "yatri.fullname" . }}-backend
